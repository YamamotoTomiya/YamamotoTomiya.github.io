- title: Research Expeerience
  type: time_table
  contents:
    - title: Doctoral Thesis Research
      institution: Nara Institute of Science and Technology (Nara, Japan)
      year: 2025.04 - current
      description:
        - "Development of Generative Models for Photocatalyst Discovery"
        - under Prof. Mikiya Fujii
        - This research focuses on developing generative models to discover novel powder-type semiconductor photocatalyst materials with desirable properties.

    - title: Internship Research
      institution: Nanyang Technological University (Singapore)
      year: 2025.04 - current
      description:
        - "Development of Generative Models for Inorganic Material Crystal Structure"
        - under Assoc. Prof. Kedar Hippalgaonkar
        - This research focuses on developing generative models to propose novel crystal structures, taking into account symmetry and thermodynamic stability.

    - title: Internship Research
      institution: Karlsruhe Institute of Technology (Baden-Wurttemberg, Germany)
      year: 2024.10 - 2025.01
      description:
        - "Large language models for the automatic extraction of data from scientific literature"
        - under T.T.-Prof. Pascal Friederich
        - This study aims to use state-of-the-art large language models (LLMs) to extract tabular data from scientific literature.
        - In my work, I deployed and fine-tuned pretrained LLMs.

    - title: Master Thesis Research
      institution: Nara Institute of Science and Technology (Nara, Japan)
      year: 2023.02 - 2025.03
      description:
        - "Multi-Objective Generative Adversarial Networks for Inorganic Chemical Compositions"
        - under Prof. Mikiya Fujii
        - This study aims to propose novel inorganic chemical compositions that satisfy multiple desired properties by developing a multi-objective conditional Generative Adversarial Network.
        - To verify the accuracy of the generation process, I utilized Density Functional Theory (DFT) calculations and an ML model called CSPML, which can predict crystal structures from compositions.

    - title: Research Student Research
      institution: Nara Institute of Science and Technology (Nara, Japan)
      year: 2023.02 - 2023.03
      description:
        - "Drug Molecule Generation with Variational Auto Encoder"
        - under Prof. Mikiya Fujii
        - Generating effective novel drug molecules through gradient-based exploration of the latent space of a Variational Auto Encoder.

    - title: Bachelor Thesis Research
      institution: Doshisha University (Kyoto, Japan)
      year: 2021.04 - 2022.09
      description:
        - "The Effects of Auditory Stimulation on Episodic Memory: A Neuroscientific Analysis using fNIRS"
        - under Prof. Hiroyasu Tomoyuki
        - Using fNIRS, which can measure blood flow in the brain, I investigated the relationship between music and long-term memory.

